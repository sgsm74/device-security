name: device_security
description: Detects rooted/jailbroken devices, emulators, USB debugging and developer options via native code. Includes a ready-made blocking UI.
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.10.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sevensoft.device_security
        pluginClass: DeviceSecurityPlugin
      ios:
        pluginClass: DeviceSecurityPlugin
